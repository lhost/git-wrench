[project]
name = "git-wrench"
version = "0.1.0"
description = "terminal-based multi-repo git workspace manager"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tomli-w>=1.2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pre-commit-hooks>=6.0.0",
    "ruff>=0.15.8",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.scripts]
git-wrench = "git_wrench.cli:main"

[tool.ruff]
line-length = 140
target-version = "py313"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.hatch.build.targets.wheel]
packages = ["git_wrench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

