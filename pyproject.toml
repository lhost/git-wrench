[project]
name = "git-wrench"
version = "0.1.0"
description = "terminal-based multi-repo git workspace manager"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Lubomir Host", email = "lubomir.host@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "tomli-w",
]

[dependency-groups]
dev = [
    "bandit",
    "black",
    "detect-secrets==0.13.1+ibm",
    "mkdocs",
    "mkdocs-awesome-pages-plugin",
    "mkdocs-blog-plugin",
    "mkdocs-callouts",
    "mkdocs-include-markdown-plugin",
    "mkdocs-material",
    "mkdocs-material[imaging]",
    "mkdocs-mermaid2-plugin",
    "mkdocs-minify-plugin",
    "mkdocs-redirects",
    "mkdocs-revealjs",
    "mkdocs-static-i18n",
    "mkdocs-video",
    "pillow",
    "pip-audit",
    "pre-commit",
    "pre-commit-hooks",
    "pymdown-extensions",
    "pyright",
    "pytest",
    "pytest-bdd",
    "pytest-cov",
    "ruff",
    "tomlq",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.scripts]
git-wrench = "git_wrench.cli:main"

[tool.ruff]
line-length = 140
target-version = "py314"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # assert False is fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra"
filterwarnings = [
    # pytest-bdd 8.1.0 uses deprecated pytest 9 APIs; ignore until upstream fixes it
    "ignore::pytest.PytestRemovedIn10Warning:pytest_bdd",
    "ignore::pytest.PytestRemovedIn10Warning:_pytest.fixtures",
]

[tool.coverage.run]
source = ["bin"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = [
    ".venv",
    ".cache",
    "__pycache__",
    "build",
    "dist",
    "tests",
]
#skips = ["B101"] # More Info: https://bandit.readthedocs.io/en/1.9.4/plugins/b101_assert_used.html

[tool.bandit.assert_used]
skips = ["*/tests/*"]

[tool.pyright]
include = ["git_wrench", "bin"]
exclude = [
    ".venv",
    ".cache",
    "__pycache__",
    "build",
    "dist",
]
typeCheckingMode = "standard"

[tool.pip-audit]
ignore-vulns = []

[tool.uv.sources]
detect-secrets = { url = "https://github.com/IBM/detect-secrets/archive/refs/tags/0.13.1+ibm.64.dss.tar.gz" }


[tool.hatch.build.targets.wheel]
packages = ["git_wrench"]
include   = ["main.py"]

# vim: ts=4 expandtab
