[project]
name = "git-wrench"
version = "0.1.0"
description = "terminal-based multi-repo git workspace manager"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tomli-w>=1.2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pre-commit-hooks>=6.0.0",
    "ruff>=0.15.8",
    "pytest>=8.0.0",
    "pyright>=1.1.409",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.scripts]
git-wrench = "git_wrench.cli:main"

[tool.ruff]
line-length = 140
target-version = "py313"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["bin"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = [
    ".venv",
    "build",
    "dist",
    "tests",
]

[tool.bandit.assert_used]
skips = ["*/tests/*"]

[tool.pyright]
include = ["git_wrench", "bin"]
exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
]
typeCheckingMode = "standard"

[tool.pip-audit]
ignore-vulns = []


[tool.hatch.build.targets.wheel]
packages = ["git_wrench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

