image: $CUSTOM_IMAGE

stages:
  - .pre
  - build-ci-image
  - test
  - build
  - mirror
  - deploy

variables:
  GITLAB_REPO_URL: "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  # Tell Pip to store cache files inside the project
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  TZ: "Europe/Bratislava"
  LANG: "en_US.UTF-8"
  GIT_DEPTH: 0  # 0 indicates a full clone (infinite fetch-depth)

# Global Cache Definition
cache:
  key:
    files:
      - uv.lock
  paths:
    - .cache/pip
    - .cache/uv
    - .venv/
    - apt-cache/

generate-env:
  stage: .pre  # Runs before everything else
  script:
    # date +%y  -> 26 (short year)
    # %-m / %-d -> removes leading zeros (e.g., 4 instead of 04)
    - export DATE_PART=$(date +%y.%-m.%-d)
    - export HASH_PART=$(cat Dockerfile wakemeops-keyring.asc pyproject.toml uv.lock .gitlab-ci.yml | sha256sum | cut -c1-7)
    - export TAG="${DATE_PART}-${HASH_PART}"
    - echo "CUSTOM_IMAGE=$CI_REGISTRY_IMAGE:$TAG" >> build.env
    # Add a fallback static pointer tag for tracking cache
    - echo "LATEST_IMAGE=$CI_REGISTRY_IMAGE:latest" >> build.env
    - cat build.env
    - env | grep -e '^(CI\|GITLAB\|LANG\|TZ)' | sort
  artifacts:
    reports:
      dotenv: build.env

build-ci-image:
  stage: build-ci-image
  needs:
    - job: generate-env
      artifacts: true
  image: quay.io/buildah/stable:latest
  variables:
    # Buildah needs a storage driver to work inside a container
    STORAGE_DRIVER: vfs
  script:
    - buildah login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # 1. Try to pull the exact calculated date/hash image to see if it already exists
    - |
      if buildah pull $CUSTOM_IMAGE >/dev/null 2>&1; then
        echo "Image $CUSTOM_IMAGE already exists in registry. Skipping build."
      else
        echo "Image not found. Checking if we can pull the latest base to build or tag..."
        # Pull the latest existing image to use as a quick layer cache
        buildah pull $LATEST_IMAGE >/dev/null 2>&1 || true

        # Build the new tag and update the latest reference simultaneously
        buildah bud --cache-from $CI_REGISTRY_IMAGE --format oci -t $CUSTOM_IMAGE -t $LATEST_IMAGE .
        buildah push $CUSTOM_IMAGE
        buildah push $LATEST_IMAGE
      fi
  rules:
    # Also allow manual trigger if something goes wrong
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "master"

# --- HELPERS ---
.ssh_setup: &ssh_setup
  before_script:
    - eval $(ssh-agent -s)
    - export GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=no"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$SSH_CONFIG" > ~/.ssh/config
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod -R og-rwx ~/.ssh

# --- TEST STAGE ---
# Runs on every commit to every branch
run-tests:
  stage: test
  script:
    - make test
  rules:
    - if: $CI_COMMIT_BRANCH

# --- BUILD STAGE ---
# Compiles Markdown to HTML and pushes to a specific branch on GitLab
build-pages:
  stage: build
  script:
    - make generate-badge
    - git config --global user.name "CI Builder"
    - git config --global user.email "ci@yourdomain.com"
    - git remote set-url origin $GITLAB_REPO_URL
    # Determine which branch to push to based on current branch
    - |
      if [ "$CI_COMMIT_BRANCH" == "master" ]; then
        uv run mkdocs gh-deploy --remote-branch gh-pages --force
      elif [ "$CI_COMMIT_BRANCH" == "develop" ]; then
        uv run mkdocs gh-deploy --remote-branch gh-pages-stage --force
      fi
  artifacts:
    paths:
      - posts-count.svg
    expire_in: never  # Keep the latest version forever for the badge link
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "develop"

build-packages-deb:
  stage: build
  image: debian:trixie-slim
  variables:
    GIT_DEPTH: 0
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
      debhelper dh-python python3-all python3-hatchling python3-installer
      python3-build pybuild-plugin-pyproject
  script:
    - make deb
  artifacts:
    paths:
      - dist/deb/*.deb
      - dist/deb/*.changes
    expire_in: never
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "develop"

build-packages-rpm:
  stage: build
  image: quay.io/centos/centos:stream9
  variables:
    # Do not inherit the global uv/pip cache keys — not relevant for an rpm build
    GIT_DEPTH: 0
  before_script:
    - dnf config-manager --set-enabled crb
    - dnf install -y epel-release
    # dnf swap curl-minimal curl
    - dnf install -y rpm-build python3-devel python3-pip python3-wheel
      python3-build python3-installer python3-hatchling make
  script:
    - make rpm
  artifacts:
    paths:
      - dist/rpmbuild/RPMS/
      - dist/rpmbuild/SRPMS/
    expire_in: never
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "develop"

# --- MIRROR STAGE ---
# Force pushes the build-only branches to your external mirror
mirror-to-external:
  stage: mirror
  <<: *ssh_setup
  script:
    - git remote add mirror $MIRROR_URL
    - |
      if [ "$CI_COMMIT_BRANCH" == "master" ]; then
        echo "Mirroring production documentation"
        git fetch origin gh-pages:gh-pages && git push mirror gh-pages --force
      elif [ "$CI_COMMIT_BRANCH" == "develop" ]; then
        echo "Mirroring staging documentation"
        git fetch origin gh-pages-stage:gh-pages-stage && git push mirror gh-pages-stage --force
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "develop"

# --- DEPLOY STAGE ---
# SSH into the server and tell it to pull from the Mirror
deploy:
  stage: deploy
  <<: *ssh_setup
  script:
    # We fetch from the mirror on the server itself to keep it updated
    - ssh $SERVER_USER@$TARGET_IP "cd $WEB_ROOT && git fetch origin && git reset --hard origin/$TARGET_BRANCH"
  parallel:
    matrix:
      - TARGET_IP: [$STAGE_SERVER_NAME]
        SERVER_USER: $STAGE_SERVER_USER
        TARGET_BRANCH: "gh-pages-stage"
        WEB_ROOT: $STAGE_WEB_ROOT
        CONF_BRANCH: "develop"

      - TARGET_IP: [$PROD_SERVER_NAME]
        SERVER_USER: $PROD_SERVER_USER
        TARGET_BRANCH: "gh-pages"
        WEB_ROOT: $PROD_WEB_ROOT
        CONF_BRANCH: "master"
  rules:
    - if: $CI_COMMIT_BRANCH == $CONF_BRANCH
